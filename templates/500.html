<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 – Server Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body style="background:#f0f4f8; display:flex; align-items:center; justify-content:center; min-height:100vh;">
    <div style="text-align:center; max-width:480px; padding:40px 24px;">
        <div style="font-size:96px; font-weight:800; color:#e2e8f0; line-height:1;">500</div>
        <div style="font-size:48px; margin:-16px 0 16px;">⚠️</div>
        <h2 style="font-size:22px; font-weight:800; color:#0f172a; margin-bottom:10px;">Internal Server Error</h2>
        <p style="font-size:14px; color:#64748b; margin-bottom:28px; line-height:1.7;">
            Something went wrong on our end. Please try again or go back to the dashboard.
        </p>
        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <a href="{{ url_for('dashboard.index') }}" class="btn-hv btn-hv-primary" style="display:inline-flex;">
                <i class="fa-solid fa-house"></i> Dashboard
            </a>
            <a href="javascript:history.back()" class="btn-hv btn-hv-outline" style="display:inline-flex;">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </a>
        </div>
    </div>
</body>
</html>
